name: Label issues ready after PR merge

on:
  issues:
    types: [closed]

permissions:
  issues: write
  pull-requests: read

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.issue.number;
            const closedAt = context.payload.issue.closed_at;
            const result = await github.graphql(`
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $number) {
                    state
                    closedAt
                    timelineItems(last: 1, itemTypes: [CLOSED_EVENT]) {
                      nodes {
                        ... on ClosedEvent {
                          createdAt
                          closer {
                            __typename
                            ... on PullRequest { number merged }
                            ... on Commit { oid }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `, { owner, repo, number });

            const issue = result.repository.issue;
            if (issue.state !== "CLOSED" || issue.closedAt !== closedAt) {
              console.log("The issue was reopened or closed again; skipping this event.");
              return;
            }

            const event = issue.timelineItems.nodes[0];
            const eventDelay = event && Date.parse(event.createdAt) - Date.parse(closedAt);
            if (!event || eventDelay < 0 || eventDelay > 300000) {
              throw new Error("Could not find the closure event for this issue.");
            }

            let merged = event.closer?.__typename === "PullRequest" && event.closer.merged;
            if (event.closer?.__typename === "Commit") {
              const pulls = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
                owner, repo, commit_sha: event.closer.oid, per_page: 100
              });
              // A commit can also close an issue when pushed directly; match the merge time.
              merged = pulls.some(pull => {
                const delay = Date.parse(closedAt) - Date.parse(pull.merged_at);
                return pull.merged_at && delay >= 0 && delay <= 300000;
              });
            }

            if (!merged) {
              console.log("The issue was not closed by a recently merged pull request.");
              return;
            }

            const hasLabel = async () => {
              const labels = await github.paginate(github.rest.issues.listLabelsOnIssue, {
                owner, repo, issue_number: number, per_page: 100
              });
              return labels.some(label => label.name === "ready");
            };

            // GitHub answers with HTTP 500 when the label is already present.
            if (await hasLabel()) {
              console.log(`Issue #${number} already has the ready label.`);
              return;
            }

            console.log(`Adding the ready label to issue #${number}.`);
            for (let attempt = 1; ; attempt++) {
              try {
                await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: ["ready"] });
                break;
              } catch (error) {
                // The request may have succeeded although the response failed.
                if (await hasLabel()) break;
                if (attempt >= 4) throw error;
                console.log(`Adding the label failed (${error.message}); retrying.`);
                await new Promise(resolve => setTimeout(resolve, attempt * 15000));
              }
            }
